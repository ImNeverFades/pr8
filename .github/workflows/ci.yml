name: API CI/CD

# 1. Когда запускать 
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. Что именно делать 
jobs:
  build-and-test:
    runs-on: ubuntu-latest 
    
    # 5 раздел
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    # 3. Пошаговая инструкция 
    steps:
      - name: Скачиваем код репозитория
        uses: actions/checkout@v4

      # ЗАМЕНЯЕМ ВЕРСИЮ 3.11 НА ПЕРЕМЕННУЮ ${{ matrix.python-version }}:
      - name: Устанавливаем Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Устанавливаем зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Запускаем линтер для проверки стиля кода 
      - name: Проверка кода линтером (Ruff)
        run: ruff check .

      # 5. Запускаем тесты для проверки логики 
      - name: Запуск автотестов (Pytest)
        run: pytest
